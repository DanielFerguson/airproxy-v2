id: 44364
name: Airproxy
environments:
  production:
    scheduler: true
    memory: 128
    cli-memory: 512
    runtime: "php-8.2:al2"
    storage: airproxy-storage
    database: airproxy-db
    cache: airproxy-cache
    domain: airproxy.app
    octane: true
    octane-database-session-persist: true
    octane-database-session-ttl: 10
    build:
      - "composer install --no-dev"
      - "php artisan event:cache"
      - "npm ci && npm run build && rm -rf node_modules"
